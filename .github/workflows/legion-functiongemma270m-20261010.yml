name: LEGION FunctionGemma 270M one-time evaluation artifact
on:
  push:
    branches:
      - legion-gemma270m-transport-20261010-a
    paths:
      - .github/workflows/legion-functiongemma270m-20261010.yml
permissions:
  contents: read
jobs:
  stage-functiongemma:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and verify ggml-org public FunctionGemma Q8 GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 600 \
            --output functiongemma-270m-it-q8_0.gguf \
            'https://huggingface.co/ggml-org/functiongemma-270m-it-GGUF/resolve/main/functiongemma-270m-it-q8_0.gguf?download=true'
          printf '%s  %s\n' '83940d4dd9676710856f43523bed096164a595a96f6b34771610a03937de5270' 'functiongemma-270m-it-q8_0.gguf' | sha256sum --check
          test "$(stat -c %s functiongemma-270m-it-q8_0.gguf)" -gt 280000000
          test "$(head -c 4 functiongemma-270m-it-q8_0.gguf)" = 'GGUF'
          curl --fail --location --retry 2 --max-time 40 \
            'https://ai.google.dev/gemma/terms/' --output GEMMA_TERMS.html
          printf 'Gemma is provided under and subject to the Gemma Terms of Use found at ai.google.dev/gemma/terms\nModel source: https://huggingface.co/ggml-org/functiongemma-270m-it-GGUF\nModel derivative use restrictions still apply; this artifact is for isolated LEGION evaluation.\n' > NOTICE.txt
      - name: Upload one-day verified evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: legion-functiongemma-270m-q8-20261010
          path: |
            functiongemma-270m-it-q8_0.gguf
            GEMMA_TERMS.html
            NOTICE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
